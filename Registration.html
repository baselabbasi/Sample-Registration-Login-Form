<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="RegistrationSection">
      <div class="left side">
        <div class="signup">
          <h1 id="signupTitle">Sign Up</h1>
          <p id="signupText">
            Sign up with your simple details.<br />
            It will nbe cross checked by the administration.
          </p>
        </div>

        <div class="signin">
          <h1 id="signinTitle">Sign In</h1>
          <p id="signinText">Sign in with your email and password</p>
        </div>
      </div>
      <div class="right side">
        <form>
          <div class="username">
            <label for="username">User Id:</label>
            <input type="text" id="username" name="username" />
            <span id="usernameError" class="error-message"></span>
          </div>

          <div class="password">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" />
            <span id="passwordError" class="error-message"></span>
          </div>

          <div class="name">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" />
            <span id="nameError" class="error-message"></span>
          </div>

          <div class="address">
            <label for="Address">Address:</label>
            <input type="text" id="address" name="address" />
            <span id="addressError" class="error-message"></span>
          </div>

          <div class="country">
            <label for="country">Country:</label>
            <select id="country" name="country">
              <option value="">Select a country</option>
              <option value="Egypt">Egypt</option>
              <option value="Saudi Arabia">Saudi Arabia</option>
              <option value="Jordan">Jordan</option>
              <option value="Syria">Syria</option>
              <option value="Iraq">Iraq</option>
              <option value="Lebanon">Lebanon</option>
              <option value="Libya">Libya</option>
              <option value="Yemen">Yemen</option>
              <option value="Sudan">Sudan</option>
              <option value="Algeria">Algeria</option>
              <option value="Morocco">Morocco</option>
            </select>
            <span id="countryError" class="error-message"></span>
          </div>

          <div class="zipCode">
            <label for="zipCode">Zip Code:</label>
            <input type="text" id="zipCode" name="zipCode" />
            <span id="zipCodeError" class="error-message"></span>
          </div>

          <div class="email">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" />
            <span id="emailError" class="error-message"></span>
          </div>

          <div class="sex">
            <label for="sex">Sex:</label>

            <input type="radio" id="male" name="sex" value="male" />
            <label for="male">Male</label>
            <input type="radio" id="female" name="sex" value="female" />
            <label for="female">Female</label>

            <br />
            <span id="sexError" class="error-message"></span>
          </div>

          <div class="language">
            <label for="language">Language:</label>
            <input type="checkbox" id="arabic" name="language" value="arabic" />
            <label for="arabic">Arabic</label>
            <input
              type="checkbox"
              id="nonArabic"
              name="language"
              value="Non Arabic"
            />
            <label for="nonArabic">Non Arabic</label>
            <span id="languageError" class="error-message"></span>
          </div>

          <div class="about">
            <label for="About">About:</label>
            <textarea id="about" name="about" rows="4" cols="50"></textarea>
            <span id="aboutError" class="error-message"></span>
          </div>
          <div class="loginOrSignup">
            <div class="login">
              <input
                type="button"
                value="Log in"
                onclick="window.location.href = 'Login.html'"
              />
            </div>

            <p id="or">or</p>

            <div class="submit">
              <input
                type="submit"
                value="Sign Up"
                onclick="initRegistration()"
              />
            </div>
          </div>
        </form>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
