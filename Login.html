<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
    <title>Login</title>
  </head>

  <body>
    <section class="LoginSection">
      <div class="left side">
        <div class="signup">
          <h1 id="signupTitle">Sign Up</h1>
          <p id="signupText">
            Sign up with your simple details.<br />
            It will nbe cross checked by the administration.
          </p>
        </div>

        <div class="signin">
          <h1 id="signinTitle">Sign In</h1>
          <p id="signinText">Sign in with your email and password</p>
        </div>
      </div>

      <div class="right side">
        <form>
          <div class="field">
            <label for="firstName">First Name:</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="example new"
            />
          </div>
          <div class="field">
            <label for="lastName">Last Name:</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="example last"
            />
          </div>

          <div class="field">
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@example.com"
            />
          </div>

          <div class="field">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" />
          </div>

          <div class="field full">
            <input type="checkbox" id="agreement" name="agreement" />

            <label for="agreement">I agree to the terms and conditions</label>
          </div>
          <div class="field full">
 <div class="loginOrSignup">
          <div class="signUp">
            <input
              type="button"
              value="Sign up"
              onclick="window.location.href = 'Registration.html'"
            />
          </div>

          <p id="or">or</p>

          <div class="login">
            <input type="submit" value="Log in" onclick="initLogin()" />
          </div>
          </div>
          </div>
        </form>
        <span id="agreementError" class="error-message"></span>
        <span id="loginError" class="error-message"></span>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
